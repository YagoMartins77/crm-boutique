services:
  db:
    image: mysql:8.0
    container_name: boutique_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Ya998432202@
      MYSQL_DATABASE: boutique_crm
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - boutique_db_data:/var/lib/mysql

volumes:
  boutique_db_data:
